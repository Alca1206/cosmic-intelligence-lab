# Builds the site and publishes it to GitHub Pages every time you push to "main" or "master".
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A repository named <username>.github.io is served at the root.
      # Any other repository is served at /<repository-name>/.
      - name: Work out the site address
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then BASE=""; else BASE="/${REPO}"; fi
          echo "NEXT_PUBLIC_BASE_PATH=${BASE}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${OWNER}.github.io${BASE}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
